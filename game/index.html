<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara: an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0e1a24;
  }
  #game {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  /* Spoken aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<!-- The canvas fills the window; src/main.js boots the game as a module. -->
<canvas id="game" aria-label="Solara: an open-world crime game. Explore the city on foot or by car, take jobs for Mara Voss, and stay ahead of the police."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript>Solara needs JavaScript to run.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
